name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치/PR에서 새 푸시가 있으면 이전 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # macOS도 한 번 검증 (UI 런처/경로 처리 회귀 방지)
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 단위 테스트
        env:
          PYTHONPATH: src
        run: |
          python tests/test_basic.py

      - name: 시연 시나리오 ① 스모크 테스트
        env:
          PYTHONPATH: src
        run: |
          python demos/scenario_1.py

      - name: 시연 시나리오 ② 스모크 테스트
        env:
          PYTHONPATH: src
        run: |
          python demos/scenario_2.py

      - name: CLI 동작 확인
        env:
          PYTHONPATH: src
        run: |
          python -m osmu_kr.cli config
          python -m osmu_kr.cli seed --seed "테스트 키워드"
          python -m osmu_kr.cli recommend --top 3

  lint-syntax:
    name: 전체 파일 컴파일 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: py_compile (구문 오류 사전 차단)
        run: |
          python - <<'PY'
          import py_compile, os, sys
          err = 0
          for root, _, files in os.walk('.'):
              if any(skip in root for skip in ('__pycache__', '/.venv', '/.git', '/data')):
                  continue
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try:
                          py_compile.compile(p, doraise=True)
                      except py_compile.PyCompileError as e:
                          err += 1
                          print(f"FAIL {p}: {e}", file=sys.stderr)
          sys.exit(1 if err else 0)
          PY
